<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0ea5e9" />
    <script>
      const themeKey = 'webservices-portfolio-theme';
      const storedTheme = localStorage.getItem(themeKey);
      const initialTheme = storedTheme === 'light' || storedTheme === 'dark'
        ? storedTheme
        : 'dark';
      document.documentElement.dataset.theme = initialTheme;
      document.documentElement.classList.toggle('dark', initialTheme === 'dark');
    </script>

    <!-- Primary Meta Tags -->
    <title>[VERIFY] Brand Name | Creative Digital Agency for Growing Brands</title>
    <meta name="title" content="[VERIFY] Brand Name | Creative Digital Agency for Growing Brands" />

    <meta name="author" content="[VERIFY] Brand Name" />
    <meta name="robots" content="index, follow" />
